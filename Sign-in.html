<!DOCTYPE html> 
<html> 
<head> 
    <meta charset="utf-8"> 
    <title>Sign in Page</title> 
    <link rel="stylesheet" href="css/signin.css"> 
</head> 
<body> 
    <div class="logo"> 
        <img src="Icons/Logo2.png" alt="logo" width="395" height="160"> 
    </div> 
    <div class="signIN"> 
        <div class="mountain" id="mountain"> 
            <img src="Icons/Frame 31.png" alt="mountain"> 
        </div> 
        <div class="formy"> 
            <form onsubmit="return false;"> 
                <h2>WELCOME!</h2> 
                <div class="inback"> 
                    <div class="words"> 
                        <!-- Error Messages -->
                        <div class="errorbox" id="errormsg" style="display:none;"> 
                            <p style="color:rgb(62, 59, 59);">Enter at least 8 characters for password</p> 
                        </div> 
                        <div class="errorbox2" id="errormsgsignup" style="display:none;"> 
                            <p style="color:rgb(62, 59, 59);">Wrong email or password</p> 
                        </div> 

                        <!-- Form Inputs -->
                        <label>Email<br> 
                            <input type="email" id="emailInput" name="email" placeholder="Enter your email address" required> 
                            <br> 
                        </label> 
                        <br> 
                        <label>Password<br> 
                            <input type="password" id="passwordInput" name="password" placeholder="Enter your password" required> 
                        </label> 
                        <br><br> 

                        <!-- Action Buttons -->
                        <a class="submit" href="#" onclick="checkPassword()">Sign Up</a> 
                        <br> 
                        <a class="signUp" href="#" onclick="checkemailandpassword()">Sign In</a> 

                        <!-- JavaScript Logic -->
                        <script> 
                            function checkPassword() { 
                                // Hide previous messages
                                document.getElementById("errormsg").style.display = "none";
                                document.getElementById("errormsgsignup").style.display = "none";

                                var password = document.getElementById("passwordInput").value; 
                                
                                if (password.length < 8) { 
                                    document.getElementById("errormsg").style.display = "block"; 
                                } else {
                                    alert("Sign up successful! (Password is valid)");
                                }
                            } 

                            function checkemailandpassword() { 
                                // Hide previous messages
                                document.getElementById("errormsg").style.display = "none";
                                document.getElementById("errormsgsignup").style.display = "none";

                                var email = document.getElementById("emailInput").value; 
                                var password = document.getElementById("passwordInput").value; 
                                
                                if (email === "Zeinab@gmail.com" && password === "Zeinab") { 
                                    window.location.href = "Home.html"; 
                                } else if (email === "Aisha@gmail.com" && password === "Aisha") { 
                                    window.location.href = "Home.html"; 
                                } else if (email === "Alya@gmail.com" && password === "Alya") { 
                                    window.location.href = "Home.html"; 
                                } else { 
                                    document.getElementById("errormsgsignup").style.display = "block"; 
                                } 
                            } 
                        </script> 
                    </div> 
                </div> 
            </form> 
        </div> 
    </div> 
</body> 
</html>
